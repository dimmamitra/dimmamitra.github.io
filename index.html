<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[[ASSIGNMENT D0P5]]</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Courier New', monospace;
            padding: 20px;
            line-height: 1.5;
            max-width: 800px;
            margin: 0 auto;
        }
        #terminal {
            white-space: pre-wrap;
        }
        #input-line {
            display: flex;
        }
        #prompt {
            margin-right: 10px;
            color: #fff;
        }
        #command {
            background-color: transparent;
            border: none;
            color: #fff;
            font-family: 'Courier New', monospace;
            width: 100%;
            outline: none;
        }
        .cursor {
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        .loading {
            color: #fff;
        }
        .loading::after {
            content: '';
            animation: dots 1.5s infinite;
        }
        @keyframes dots {
            0% { content: ''; }
            25% { content: '.'; }
            50% { content: '..'; }
            75% { content: '...'; }
            100% { content: ''; }
        }
        .fade-out {
            animation: fadeOut 0.5s forwards;
        }
        @keyframes fadeOut {
            to { opacity: 0; }
        }
    </style>
</head>
<body>
    <div id="terminal"></div>
    <div id="input-line">
        <span id="prompt">></span>
        <input type="text" id="command" autofocus>
    </div>

    <script>
        const terminal = document.getElementById('terminal');
        const commandInput = document.getElementById('command');
        let currentState = 'name';
        let userName = '';
        let userProgress = { currentPuzzle: 'puzzle_1', puzzlesCompleted: 0 };
        
        // REPLACE THIS WITH YOUR GOOGLE APPS SCRIPT URL
        const scriptUrl = 'https://script.google.com/macros/s/AKfycbz2OMYREh7CQljt268Z7rXh17m7Acv7sWgTQTdhCFhnUlZg34yii8a2sweLda8LpjSruQ/exec';
        
        // Function to send data to Google Apps Script
        async function logResponse(data) {
            if (scriptUrl === 'https://script.google.com/macros/s/AKfycbz2OMYREh7CQljt268Z7rXh17m7Acv7sWgTQTdhCFhnUlZg34yii8a2sweLda8LpjSruQ/exec') {
                console.log('Response not logged - script URL not configured');
                return;
            }
            
            try {
                const response = await fetch(scriptUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });
                
                if (response.ok) {
                    const result = await response.json();
                    if (result.status === 'success' && result.currentPuzzle) {
                        userProgress.currentPuzzle = result.currentPuzzle;
                        userProgress.puzzlesCompleted = result.puzzlesCompleted;
                    }
                    return result;
                }
            } catch (error) {
                console.error('Error logging response:', error);
            }
        }

        // Function to show loading animation
        function showLoading(text, duration = 5000) {
            return new Promise(resolve => {
                const loadingElement = document.createElement('div');
                loadingElement.className = 'loading';
                loadingElement.textContent = text;
                terminal.appendChild(loadingElement);
                
                setTimeout(() => {
                    terminal.removeChild(loadingElement);
                    resolve();
                }, duration);
            });
        }

        // Function to clear terminal with fade effect
        function clearTerminal() {
            const elements = terminal.children;
            for (let i = 0; i < elements.length; i++) {
                elements[i].classList.add('fade-out');
            }
            
            return new Promise(resolve => {
                setTimeout(() => {
                    terminal.innerHTML = '';
                    resolve();
                }, 500);
            });
        }

        // Function to display text temporarily
        function showTemporaryText(text, duration = 4000) {
            return new Promise(resolve => {
                // Clear terminal first
                clearTerminal().then(() => {
                    // Add the temporary text
                    terminal.innerHTML = text;
                    
                    // Wait for the specified duration
                    setTimeout(() => {
                        // Clear the terminal again
                        clearTerminal().then(resolve);
                    }, duration);
                });
            });
        }

        // Function to get personalized message based on progress
        function getPersonalizedMessage() {
            if (userProgress.puzzlesCompleted === 0) {
                return "This is your first assignment. Follow instructions carefully.";
            } else {
                return `Welcome back, agent. You have completed ${userProgress.puzzlesCompleted} puzzles so far.`;
            }
        }

        // Function to ask the proceed question
        function askProceedQuestion() {
            typeText("Do you wish to proceed? (yes/no): ")
                .then(() => {
                    currentState = 'proceed';
                    commandInput.focus();
                });
        }

        // Initial prompt
        typeText('Please enter your agent_ID: ')
            .then(() => {
                commandInput.focus();
            });

        commandInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const command = commandInput.value.trim();
                commandInput.value = '';
                
                if (currentState === 'name') {
                    userName = command;
                    terminal.innerHTML += command + '\n';
                    
                    // Log the response and get user progress
                    showLoading('Loading...')
                        .then(() => logResponse({
                            type: 'login',
                            username: userName,
                            value: 'user_login',
                            timestamp: new Date().toISOString()
                        }))
                        .then((result) => {
                            if (result && result.status === 'success') {
                                return showLoading('Loading...');
                            }
                            return Promise.resolve(); // Continue even if login fails
                        })
                        .then(() => clearTerminal())
                        .then(() => showTemporaryText(`Welcome back, ${userName}.`, 4000))
                        .then(() => {
                            typeText("<<PROJECT DELTA_OSCAR_PAPA_SIERRA>>\n\n")
                                .then(() => typeText(getPersonalizedMessage() + "\n\n"))
                                .then(() => typeText("You MUST NOT mention your assignment to anyone\n\n"))
                                .then(() => askProceedQuestion());
                        });
                } 
                else if (currentState === 'proceed') {
                    terminal.innerHTML += command + '\n';
                    
                    // Log the response
                    logResponse({
                        type: 'proceed_decision',
                        username: userName,
                        value: command,
                        timestamp: new Date().toISOString()
                    });
                    
                    if (command.toLowerCase() === 'yes') {
                        // Show loading animation before assignment
                        showLoading('Loading...')
                            .then(() => clearTerminal())
                            .then(() => showTemporaryText("Your assignment begins now.", 4000))
                            .then(() => {
                                // Based on user progress, show appropriate puzzle
                                const puzzleText = userProgress.puzzlesCompleted > 0 ? 
                                    `Next puzzle (${userProgress.currentPuzzle}):\n\n` : 
                                    "Your first task is as follows:\n\n";
                                
                                typeText(puzzleText)
                                    .then(() => typeText("Good luck, " + userName + ".\n\n"));
                                currentState = 'done';
                            });
                    } else {
                        // Show "sugma" and ask the question again
                        typeText("\nsugma\n\n")
                            .then(() => askProceedQuestion());
                    }
                }
            }
        });

        // Helper function for typing effect
        function typeText(text, speed = 20) {
            return new Promise(resolve => {
                let i = 0;
                const typing = setInterval(() => {
                    if (i < text.length) {
                        terminal.innerHTML += text.charAt(i);
                        i++;
                        terminal.scrollTop = terminal.scrollHeight;
                    } else {
                        clearInterval(typing);
                        resolve();
                    }
                }, speed);
            });
        }
    </script>
</body>
</html>
