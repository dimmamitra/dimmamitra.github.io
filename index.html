<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[[ASSIGNMENT D0P5]]</title>
<style>
    body {
        background-color: #000;
        color: #fff;
        font-family: 'Courier New', monospace;
        padding: 20px;
        line-height: 1.5;
        max-width: 800px;
        margin: 0 auto;
    }
    #terminal {
        white-space: pre-wrap;
    }
    #input-line {
        display: flex;
    }
    #prompt {
        margin-right: 10px;
        color: #fff;
    }
    #command {
        background-color: transparent;
        border: none;
        color: #fff;
        font-family: 'Courier New', monospace;
        width: 100%;
        outline: none;
    }
    .debug {
        margin-top: 20px;
        padding: 10px;
        border: 1px solid #333;
        background-color: #111;
        font-size: 12px;
        display: none;
    }
    .debug h3 {
        margin-top: 0;
        color: #0f0;
    }
    .loading {
        color: #fff;
    }
    .loading::after {
        content: '';
        animation: dots 1.5s infinite;
    }
    @keyframes dots {
        0% { content: ''; }
        25% { content: '.'; }
        50% { content: '..'; }
        75% { content: '...'; }
        100% { content: ''; }
    }
    .fade-out {
        animation: fadeOut 0.5s forwards;
    }
    @keyframes fadeOut {
        to { opacity: 0; }
    }
</style>
</head>
<body>
<div id="terminal"></div>
<div id="input-line">
    <span id="prompt">></span>
    <input type="text" id="command" autofocus>
</div>

<div id="debug" class="debug">
    <h3>Debug Info</h3>
    <div id="debug-output">Status: Initializing...</div>
</div>

<script>
const terminal = document.getElementById('terminal');
const commandInput = document.getElementById('command');
const debugOutput = document.getElementById('debug-output');
let currentState = 'name';
let userName = '';

const scriptUrl = 'https://script.google.com/macros/s/AKfycbzZGquScnvZVJ-llxV8xCqEDjVmHkjSzukwOjZIHRGzr6ZpR3XdyyGoaLLYjNk7QMUXEQ/exec'; // Replace with your Apps Script /exec URL

function updateDebug(message) {
    debugOutput.innerHTML += '<br>' + new Date().toLocaleTimeString() + ': ' + message;
    debugOutput.scrollTop = debugOutput.scrollHeight;
}

// Debug toggle for Mac (Cmd+D) and Windows (Ctrl+D)
document.addEventListener('keydown', (e)=>{
    const activeTag = document.activeElement.tagName.toLowerCase();
    if((e.ctrlKey || e.metaKey) && !e.repeat && e.key.toLowerCase() === 'd' && activeTag !== 'input'){
        const debugDiv = document.getElementById('debug');
        debugDiv.style.display = (debugDiv.style.display==='none'||debugDiv.style.display==='') ? 'block':'none';
    }
});

async function logResponse(data){
    if(!scriptUrl || !scriptUrl.includes('google.com')){
        updateDebug('ERROR: Script URL not configured');
        return {status:'error', message:'URL not configured'};
    }
    try{
        updateDebug('Sending data to: '+scriptUrl);
        const response = await fetch(scriptUrl,{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify(data)
        });
        if(response.ok){
            const text = await response.text();
            let result;
            try{
                result = JSON.parse(text);
            }catch(e){
                updateDebug('WARNING: Response not JSON, raw text: '+text);
                return {status:'error', message:'Invalid JSON response'};
            }
            updateDebug('SUCCESS: Data sent to Google Sheets');
            return result;
        }else{
            updateDebug('ERROR: Server returned '+response.status);
            return {status:'error', message:'Server error: '+response.status};
        }
    }catch(error){
        updateDebug('ERROR: '+error.message);
        return {status:'error', message:error.message};
    }
}

function showLoading(text,duration=5000){
    return new Promise(resolve=>{
        const loading = document.createElement('div');
        loading.className='loading';
        loading.textContent=text;
        terminal.appendChild(loading);
        setTimeout(()=>{
            terminal.removeChild(loading);
            resolve();
        },duration);
    });
}

function clearTerminal(){
    const elements = terminal.children;
    for(let i=0;i<elements.length;i++){
        elements[i].classList.add('fade-out');
    }
    return new Promise(resolve=>{
        setTimeout(()=>{
            terminal.innerHTML='';
            resolve();
        },500);
    });
}

function showTemporaryText(text,duration=4000){
    return new Promise(resolve=>{
        clearTerminal().then(()=>{
            terminal.innerHTML=text;
            setTimeout(()=>{clearTerminal().then(resolve);},duration);
        });
    });
}

function askProceedQuestion(){
    typeText("Do you wish to proceed? (yes/no): ")
    .then(()=>{
        currentState='proceed';
        commandInput.focus();
    });
}

typeText('Please enter your agent_ID: ').then(()=>{commandInput.focus();});

commandInput.addEventListener('keydown',(e)=>{
    if(e.key==='Enter'){
        const command = commandInput.value.trim();
        commandInput.value='';
        
        if(currentState==='name'){
            userName=command;
            terminal.innerHTML+=command+'\n';
            updateDebug('User entered name: '+command);

            showLoading('Loading...')
            .then(()=>logResponse({
                type:'login',
                username:userName,
                value:'user_login',
                timestamp:new Date().toISOString()
            }))
            .then(()=>clearTerminal())
            .then(()=>showTemporaryText(`Welcome back, ${userName}.`,4000))
            .then(()=>{
                typeText("<<PROJECT DELTA_OSCAR_PAPA_SIERRA>>\n\n")
                .then(()=>typeText("You MUST NOT mention your assignment to anyone\n\n"))
                .then(()=>askProceedQuestion());
            });
        }
        else if(currentState==='proceed'){
            terminal.innerHTML+=command+'\n';
            updateDebug('User response to proceed: '+command);

            logResponse({
                type:'proceed_decision',
                username:userName,
                value:command,
                timestamp:new Date().toISOString()
            });

            if(command.toLowerCase()==='yes'){
                showLoading('Loading...')
                .then(()=>clearTerminal())
                .then(()=>showTemporaryText("Your assignment begins now.",4000))
                .then(()=>{
                    typeText("Your first task is as follows:\n\n")
                    .then(()=>typeText("Good luck, "+userName+".\n\n"));
                    currentState='done';
                });
            }else{
                typeText("\nsugma\n\n").then(()=>askProceedQuestion());
            }
        }
    }
});

function typeText(text,speed=20){
    return new Promise(resolve=>{
        let i=0;
        const interval=setInterval(()=>{
            if(i<text.length){
                terminal.innerHTML+=text.charAt(i);
                i++;
                terminal.scrollTop=terminal.scrollHeight;
            }else{
                clearInterval(interval);
                resolve();
            }
        },speed);
    });
}

updateDebug('Script URL: '+scriptUrl);
if(scriptUrl && scriptUrl.includes('google.com')){
    updateDebug('Script URL appears configured');
}else{
    updateDebug('ERROR: Script URL needs configuration');
}
</script>
</body>
</html>
