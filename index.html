<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Treasure Hunt Puzzle</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f0f0;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      width: 400px;
      text-align: center;
    }
    .hidden {
      display: none;
    }
    .debug {
      display: none; /* HIDDEN by default */
      margin-top: 20px;
      padding: 10px;
      background: #eee;
      border: 1px solid #ccc;
      max-height: 200px;
      overflow-y: auto;
      text-align: left;
      font-size: 12px;
    }
    button {
      margin-top: 10px;
      padding: 10px;
      border: none;
      background: #007BFF;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Treasure Hunt</h1>
    <div id="game">
      <p>Welcome to the treasure hunt! Enter your name to begin:</p>
      <input type="text" id="username" placeholder="Your name">
      <button onclick="startGame()">Start</button>
    </div>
    <div id="puzzle" class="hidden">
      <p id="puzzle-text">Puzzle will appear here</p>
      <input type="text" id="answer" placeholder="Your answer">
      <button onclick="submitAnswer()">Submit</button>
    </div>
    <div id="debug" class="debug"></div>
  </div>

  <script>
    const scriptUrl = "https://script.google.com/macros/s/AKfycbzZGquScnvZVJ-llxV8xCqEDjVmHkjSzukwOjZIHRGzr6ZpR3XdyyGoaLLYjNk7QMUXEQ/exec"; // Replace with your deployed Apps Script URL
    let currentUser = "";
    let currentPuzzle = "puzzle_1";

    const debugOutput = document.getElementById('debug');
    function updateDebug(message) {
      debugOutput.innerHTML += '<br>' + new Date().toLocaleTimeString() + ': ' + message;
      debugOutput.scrollTop = debugOutput.scrollHeight;
    }

    // Allow developer toggle with "D" key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'D') {
        debugOutput.style.display =
          debugOutput.style.display === 'none' ? 'block' : 'none';
      }
    });

    async function logResponse(data) {
      if (!scriptUrl || !scriptUrl.includes('google.com')) {
        updateDebug('ERROR: Script URL not properly configured');
        updateDebug('Current URL: ' + scriptUrl);
        return {status: 'error', message: 'URL not configured'};
      }
      
      try {
        updateDebug('Sending data to: ' + scriptUrl);
        const response = await fetch(scriptUrl, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(data)
        });

        if (response.ok) {
          const text = await response.text(); // raw response
          let result;
          try {
            result = JSON.parse(text); // try to parse JSON
          } catch (e) {
            updateDebug('WARNING: Response was not JSON, raw text: ' + text);
            return {status: 'error', message: 'Invalid JSON response'};
          }
          updateDebug('SUCCESS: Data sent to Google Sheets');
          return result;
        } else {
          updateDebug('ERROR: Server returned ' + response.status);
          return {status: 'error', message: 'Server error: ' + response.status};
        }
      } catch (error) {
        updateDebug('ERROR: ' + error.message);
        return {status: 'error', message: error.message};
      }
    }

    function startGame() {
      currentUser = document.getElementById('username').value.trim();
      if (!currentUser) {
        alert('Please enter your name!');
        return;
      }
      updateDebug('User entered name: ' + currentUser);
      document.getElementById('game').classList.add('hidden');
      document.getElementById('puzzle').classList.remove('hidden');
      loadPuzzle();
    }

    function loadPuzzle() {
      const puzzleText = {
        puzzle_1: "What is 2 + 2?",
        puzzle_2: "What is the capital of France?"
      };
      document.getElementById('puzzle-text').innerText = puzzleText[currentPuzzle];
    }

    async function submitAnswer() {
      const answer = document.getElementById('answer').value.trim();
      if (!answer) {
        alert('Please enter an answer!');
        return;
      }

      const data = {
        username: currentUser,
        type: 'answer',
        value: answer
      };

      const result = await logResponse(data);
      if (result.status === 'success') {
        updateDebug('Answer logged: ' + answer);

        if (currentPuzzle === 'puzzle_1' && answer === '4') {
          currentPuzzle = 'puzzle_2';
          await logResponse({username: currentUser, type: 'puzzle_complete', value: currentPuzzle});
          loadPuzzle();
        } else if (currentPuzzle === 'puzzle_2' && answer.toLowerCase() === 'paris') {
          alert('Congratulations, you completed the treasure hunt!');
          await logResponse({username: currentUser, type: 'puzzle_complete', value: 'finished'});
        } else {
          alert('Incorrect, try again!');
        }
      } else {
        alert('Error sending data: ' + result.message);
      }
    }
  </script>
</body>
</html>
