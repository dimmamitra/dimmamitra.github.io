<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[[ASSIGNMENT D0P5]]</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Courier New', monospace;
            padding: 20px;
            line-height: 1.5;
            max-width: 800px;
            margin: 0 auto;
        }
        #terminal {
            white-space: pre-wrap;
        }
        #input-line {
            display: flex;
        }
        #prompt {
            margin-right: 10px;
            color: #fff;
        }
        #command {
            background-color: transparent;
            border: none;
            color: #fff;
            font-family: 'Courier New', monospace;
            width: 100%;
            outline: none;
        }
        .cursor {
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        .loading {
            color: #0f0;
        }
        .loading::after {
            content: '';
            animation: dots 1.5s infinite;
        }
        @keyframes dots {
            0% { content: ''; }
            25% { content: '.'; }
            50% { content: '..'; }
            75% { content: '...'; }
            100% { content: ''; }
        }
    </style>
</head>
<body>
    <div id="terminal"></div>
    <div id="input-line">
        <span id="prompt">></span>
        <input type="text" id="command" autofocus>
    </div>

    <script>
        const terminal = document.getElementById('terminal');
        const commandInput = document.getElementById('command');
        let currentState = 'name';
        let userName = '';
        
        // REPLACE THIS WITH YOUR GOOGLE APPS SCRIPT URL
        const scriptUrl = 'https://script.google.com/macros/s/AKfycbz2OMYREh7CQljt268Z7rXh17m7Acv7sWgTQTdhCFhnUlZg34yii8a2sweLda8LpjSruQ/exec';
        
        // Function to send data to Google Apps Script
        async function logResponse(data) {
            if (scriptUrl === 'https://script.google.com/macros/s/AKfycbz2OMYREh7CQljt268Z7rXh17m7Acv7sWgTQTdhCFhnUlZg34yii8a2sweLda8LpjSruQ/exec') {
                console.log('Response not logged - script URL not configured');
                return;
            }
            
            try {
                const response = await fetch(scriptUrl, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });
                
                // Note: We use no-cors mode so we can't read the response
                // But the data will still be sent to the server
            } catch (error) {
                console.error('Error logging response:', error);
            }
        }

        // Function to show loading animation
        function showLoading(text, duration = 2000) {
            return new Promise(resolve => {
                const loadingElement = document.createElement('div');
                loadingElement.className = 'loading';
                loadingElement.textContent = text;
                terminal.appendChild(loadingElement);
                
                setTimeout(() => {
                    terminal.removeChild(loadingElement);
                    resolve();
                }, duration);
            });
        }

        // Initial prompt
        typeText('Please enter your agent_ID: ')
            .then(() => {
                commandInput.focus();
            });

        commandInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const command = commandInput.value.trim();
                commandInput.value = '';
                
                if (currentState === 'name') {
                    userName = command;
                    terminal.innerHTML += command + '\n';
                    
                    // Log the response
                    logResponse({
                        type: 'name',
                        value: command,
                        timestamp: new Date().toISOString()
                    });
                    
                    // Show loading animation
                    showLoading('Authenticating')
                        .then(() => showLoading('Establishing secure connection'))
                        .then(() => showLoading('Accessing project files'))
                        .then(() => {
                            typeText(`\nWelcome back, ${userName}.\n\n`)
                                .then(() => typeText("<<PROJECT DELTA_OSCAR_PAPA_SIERRA>>\n\n"))
                                .then(() => typeText("You MUST NOT mention your assignment to anyone\n\n"))
                                .then(() => typeText("Do you wish to proceed? (yes/no): "))
                                .then(() => {
                                    currentState = 'proceed';
                                    commandInput.focus();
                                });
                        });
                } 
                else if (currentState === 'proceed') {
                    terminal.innerHTML += command + '\n';
                    
                    // Log the response
                    logResponse({
                        type: 'proceed',
                        value: command,
                        name: userName,
                        timestamp: new Date().toISOString()
                    });
                    
                    if (command.toLowerCase() === 'yes') {
                        // Show loading animation before assignment
                        showLoading('Initializing assignment protocol')
                            .then(() => showLoading('Decrypting mission parameters'))
                            .then(() => {
                                typeText("\nYour assignment begins now.\n\n")
                                    .then(() => typeText("Your first task is as follows:\n\n"))
                                    .then(() => typeText("Good luck, " + userName + ".\n\n"));
                                currentState = 'done';
                            });
                    } else {
                        typeText("\nsugma\n\n");
                        currentState = 'done';
                    }
                }
            }
        });

        // Helper function for typing effect
        function typeText(text, speed = 20) {
            return new Promise(resolve => {
                let i = 0;
                const typing = setInterval(() => {
                    if (i < text.length) {
                        terminal.innerHTML += text.charAt(i);
                        i++;
                        terminal.scrollTop = terminal.scrollHeight;
                    } else {
                        clearInterval(typing);
                        resolve();
                    }
                }, speed);
            });
        }
    </script>
</body>
</html>
