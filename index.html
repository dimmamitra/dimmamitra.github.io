<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[[ASSIGNMENT D0P5]]</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Courier New', monospace;
            padding: 20px;
            line-height: 1.5;
            max-width: 800px;
            margin: 0 auto;
        }
        #terminal {
            white-space: pre-wrap;
        }
        #input-line {
            display: flex;
        }
        #prompt {
            margin-right: 10px;
            color: #fff;
        }
        #command {
            background-color: transparent;
            border: none;
            color: #fff;
            font-family: 'Courier New', monospace;
            width: 100%;
            outline: none;
        }
        .debug {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #333;
            background-color: #111;
            font-size: 12px;
            display: block; /* Changed to always show for debugging */
        }
        .debug h3 {
            margin-top: 0;
            color: #0f0;
        }
        .debug-toggle {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background: #333;
            color: white;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
        }
        .loading {
            color: #fff;
        }
        .loading::after {
            content: '';
            animation: dots 1.5s infinite;
        }
        @keyframes dots {
            0% { content: ''; }
            25% { content: '.'; }
            50% { content: '..'; }
            75% { content: '...'; }
            100% { content: ''; }
        }
        .fade-out {
            animation: fadeOut 0.5s forwards;
        }
        @keyframes fadeOut {
            to { opacity: 0; }
        }
    </style>
</head>
<body>
    <div id="terminal"></div>
    <div id="input-line">
        <span id="prompt">></span>
        <input type="text" id="command" autofocus>
    </div>

    <div id="debug" class="debug">
        <h3>Debug Info</h3>
        <div id="debug-output">Status: Initializing...</div>
    </div>

    <script>
        const terminal = document.getElementById('terminal');
        const commandInput = document.getElementById('command');
        const debugOutput = document.getElementById('debug-output');
        let currentState = 'name';
        let userName = '';
        
        // Your Google Apps Script URL - MAKE SURE TO REPLACE THIS
        const scriptUrl = 'https://script.google.com/macros/s/AKfycbzZGquScnvZVJ-llxV8xCqEDjVmHkjSzukwOjZIHRGzr6ZpR3XdyyGoaLLYjNk7QMUXEQ/exec';
        
        function updateDebug(message) {
            debugOutput.innerHTML += '<br>' + new Date().toLocaleTimeString() + ': ' + message;
            debugOutput.scrollTop = debugOutput.scrollHeight;
        }

        // Function to send data to Google Apps Script
        async function logResponse(data) {
            // Simple check if scriptUrl looks valid
            if (!scriptUrl || !scriptUrl.includes('google.com')) {
                updateDebug('ERROR: Script URL not properly configured');
                updateDebug('Current URL: ' + scriptUrl);
                return {status: 'error', message: 'URL not configured'};
            }
            
            try {
                updateDebug('Sending data to: ' + scriptUrl);
                const response = await fetch(scriptUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });
                
                if (response.ok) {
                    const result = await response.json();
                    updateDebug('SUCCESS: Data sent to Google Sheets');
                    return result;
                } else {
                    updateDebug('ERROR: Server returned ' + response.status);
                    return {status: 'error', message: 'Server error: ' + response.status};
                }
            } catch (error) {
                updateDebug('ERROR: ' + error.message);
                return {status: 'error', message: error.message};
            }
        }

        // Function to show loading animation
        function showLoading(text, duration = 5000) {
            return new Promise(resolve => {
                const loadingElement = document.createElement('div');
                loadingElement.className = 'loading';
                loadingElement.textContent = text;
                terminal.appendChild(loadingElement);
                
                setTimeout(() => {
                    terminal.removeChild(loadingElement);
                    resolve();
                }, duration);
            });
        }

        // Function to clear terminal with fade effect
        function clearTerminal() {
            const elements = terminal.children;
            for (let i = 0; i < elements.length; i++) {
                elements[i].classList.add('fade-out');
            }
            
            return new Promise(resolve => {
                setTimeout(() => {
                    terminal.innerHTML = '';
                    resolve();
                }, 500);
            });
        }

        // Function to display text temporarily
        function showTemporaryText(text, duration = 4000) {
            return new Promise(resolve => {
                clearTerminal().then(() => {
                    terminal.innerHTML = text;
                    setTimeout(() => {
                        clearTerminal().then(resolve);
                    }, duration);
                });
            });
        }

        // Function to ask the proceed question
        function askProceedQuestion() {
            typeText("Do you wish to proceed? (yes/no): ")
                .then(() => {
                    currentState = 'proceed';
                    commandInput.focus();
                });
        }

        // Initial prompt
        typeText('Please enter your agent_ID: ')
            .then(() => {
                commandInput.focus();
            });

        commandInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const command = commandInput.value.trim();
                commandInput.value = '';
                
                if (currentState === 'name') {
                    userName = command;
                    terminal.innerHTML += command + '\n';
                    updateDebug('User entered name: ' + command);
                    
                    // Log the response
                    showLoading('Loading...')
                        .then(() => logResponse({
                            type: 'login',
                            username: userName,
                            value: 'user_login',
                            timestamp: new Date().toISOString()
                        }))
                        .then(() => clearTerminal())
                        .then(() => showTemporaryText(`Welcome back, ${userName}.`, 4000))
                        .then(() => {
                            typeText("<<PROJECT DELTA_OSCAR_PAPA_SIERRA>>\n\n")
                                .then(() => typeText("You MUST NOT mention your assignment to anyone\n\n"))
                                .then(() => askProceedQuestion());
                        });
                } 
                else if (currentState === 'proceed') {
                    terminal.innerHTML += command + '\n';
                    updateDebug('User response to proceed: ' + command);
                    
                    // Log the response
                    logResponse({
                        type: 'proceed_decision',
                        username: userName,
                        value: command,
                        timestamp: new Date().toISOString()
                    });
                    
                    if (command.toLowerCase() === 'yes') {
                        // Show loading animation before assignment
                        showLoading('Loading...')
                            .then(() => clearTerminal())
                            .then(() => showTemporaryText("Your assignment begins now.", 4000))
                            .then(() => {
                                typeText("Your first task is as follows:\n\n")
                                    .then(() => typeText("Good luck, " + userName + ".\n\n"));
                                currentState = 'done';
                            });
                    } else {
                        // Show "sugma" and ask the question again
                        typeText("\nsugma\n\n")
                            .then(() => askProceedQuestion());
                    }
                }
            }
        });

        // Helper function for typing effect
        function typeText(text, speed = 20) {
            return new Promise(resolve => {
                let i = 0;
                const typing = setInterval(() => {
                    if (i < text.length) {
                        terminal.innerHTML += text.charAt(i);
                        i++;
                        terminal.scrollTop = terminal.scrollHeight;
                    } else {
                        clearInterval(typing);
                        resolve();
                    }
                }, speed);
            });
        }
        
        // Initial debug message
        updateDebug('Script URL: ' + scriptUrl);
        if (scriptUrl && scriptUrl.includes('google.com')) {
            updateDebug('Script URL appears to be configured');
        } else {
            updateDebug('ERROR: Script URL needs to be configured');
        }
    </script>
</body>
</html>
